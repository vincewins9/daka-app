function generateDynamicBadge(days) {

function subscribeRealtime() {
  if(rtChannel) supabaseClient.removeChannel(rtChannel);
  rtChannel = supabaseClient.channel('state-'+SPACE_ID).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state', filter: 'space_id=eq.'+SPACE_ID }, payload => {
    if(payload.new.updated_by === CURRENT_USER_ID) return;
    const myId = DB.currentMemberId;
    DB = Object.assign(def(), payload.new.data);
    DB.currentMemberId = myId;
    saveLocalCache();
    refreshMembers().then(()=>{ applyTheme(); render(); });
  }).subscribe();
}

async function boot() {
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) {
      const { data, error } = await supabaseClient.auth.signInAnonymously();
      if(error) throw error;
      CURRENT_USER_ID = data.user.id;
    } else { CURRENT_USER_ID = user.id; }

    const { data: mem } = await supabaseClient.from('members').select('space_id').eq('user_id', CURRENT_USER_ID).maybeSingle();
    if(!mem) {
      $('#loading-screen').style.display = 'none';
      UI.view = 'onboard'; render(); return;
    }

    SPACE_ID = mem.space_id;
    loadLocalCache(); 
    $('#loading-screen').style.display = 'none';
    if(DB.space) { UI.view = 'main'; applyTheme(); render(); }

    const { data: row } = await supabaseClient.from('app_state').select('data').eq('space_id', SPACE_ID).single();
    if(row && row.data && Object.keys(row.data).length) {
      const myId = DB.currentMemberId;
      DB = Object.assign(def(), row.data);
      if(myId) DB.currentMemberId = myId;
      saveLocalCache();
    }
    await refreshMembers();
    UI.view = 'main'; applyTheme(); render(); subscribeRealtime();
  } catch(e) {
    console.error(e);
    $('#loading-screen').innerHTML = '<div style="color:red;padding:20px;text-align:center;font-size:14px;line-height:1.5">连接失败，请刷新重试<br><br>错误信息：<br>'+e.message+'<br><br><span style="font-size:12px;color:#888">(请检查是否在 Supabase 执行了 SQL 语句并开启了匿名登录)</span></div>';
  }
}

const mIdx=id=>DB.members.findIndex(m=>m.id===id);
const mColor=id=>COLORS[mIdx(id)]||COLORS[0];
const me=()=>DB.members.find(m=>m.id===DB.currentMemberId)||DB.members[0];

const hasMet=d=>DB.meetups.some(x=>x.date===d);
function dSet(mid){const s=new Set();for(const c of DB.checkins)if(c.memberId===mid)s.add(c.date);return s;}
function streakOf(ds,t){t=t||today();const a=ds.has(t)?t:addD(t,-1);if(!ds.has(a))return 0;let n=0,c=a;while(ds.has(c)){n++;c=addD(c,-1);}return n;}
const curStreak=id=>streakOf(dSet(id));
function curModStreak(mid, modId) { const ds = new Set(DB.checkins.filter(c=>c.memberId===mid && c.moduleId===modId).map(c=>c.date)); return streakOf(ds); }
function getModuleStats(mid, modId) {
  const recs = DB.checkins.filter(c => c.memberId === mid && c.moduleId === modId).map(c => c.date).sort();
  const total = recs.length; if (total === 0) return { total: 0, current: 0, lost: 0, best: 0 };
  const ds = new Set(recs); const t = today(); let cur = streakOf(ds); let lost = 0;
  const last = recs[recs.length - 1];
  if (last < t) { lost = Math.round((parseD(t) - parseD(last)) / 86400000) - 1; if (lost < 0) lost = 0; }
  let best = 0, run = 0, prev = null;
  for (const d of recs) { run = (prev && addD(prev, 1) === d) ? run + 1 : 1; if (run > best) best = run; prev = d; }
  return { total, current: cur, lost, best };
}
function getMemberMaxBadgeInfo(mid) {
  const mods = DB.modules.filter(x=>x.status==='active'); let maxDays = 0; let bestMod = null;
  mods.forEach(mod => { const st = getModuleStats(mid, mod.id); if(st.best > maxDays) { maxDays = st.best; bestMod = mod; } });
  return { maxDays, bestMod };
}
function getMemberUnlockedBadges(mid) {
  const mods = DB.modules.filter(x=>x.status==='active'); const unlockedMap = {};
  mods.forEach(mod => {
    const st = getModuleStats(mid, mod.id); if(st.best === 0) return;
    Object.keys(BADGE_DEFS).forEach(dStr => {
      const days = parseInt(dStr);
      if (st.best >= days) { if(!unlockedMap[days]) unlockedMap[days] = { badge: BADGE_DEFS[dStr], mods: [] }; unlockedMap[days].mods.push(mod); }
    });
  });
  return unlockedMap;
}

  if(!UI.badgeViewMemberId) UI.badgeViewMemberId = DB.currentMemberId;
  const targetMem = DB.members.find(x=>x.id===UI.badgeViewMemberId) || me();
  const maxInfo = getMemberMaxBadgeInfo(targetMem.id);
  const unlockedMap = getMemberUnlockedBadges(targetMem.id);
  
  let html = '<div class="main"><div class="header"><div class="space-name" style="font-size:22px;text-align:center;margin-top:10px">🎖️ 徽章墙</div></div><div class="member-tabs">';

    html += '<button class="member-tab ' + (m.id===UI.badgeViewMemberId?'on':'') + '" data-action="switch-badge-view" data-id="' + m.id + '"><span style="width:8px;height:8px;border-radius:50%;background:' + mColor(m.id) + '"></span>' + esc(m.name) + '</button>';
  });
  html += '</div><div class="card" style="padding:16px;margin-bottom:16px;text-align:center;background:linear-gradient(135deg,#fff,var(--line2))"><div style="font-size:13px;color:var(--ink2);margin-bottom:6px">' + esc(targetMem.name) + ' 的最高记录</div><div style="font-size:28px;font-weight:800;color:' + mColor(targetMem.id) + ';font-variant-numeric:tabular-nums">' + maxInfo.maxDays + ' <span style="font-size:14px">天</span></div></div>';
  
  html += '<div class="badges-grid">';
  const displayDays = [];
  for(let i=1; i<=30; i++) displayDays.push(i);
  [50, 100, 200, 365, 730, 1000].forEach(d => { if(!displayDays.includes(d)) displayDays.push(d); });

  displayDays.forEach(d => {
    const b = getBadge(d);

    let modTag = '';
    if (!locked && unlockInfo && unlockInfo.mods.length > 0) {
      modTag = '<div class="badge-mod-tag">由 ' + unlockInfo.mods[0].icon + ' ' + esc(unlockInfo.mods[0].name) + '</div>';

  const showBackfill = isSelf && !d.backfill;

      initial.members = [{ id: mem.id, name: nm, joinedAt: Date.now(), userId: CURRENT_USER_ID }];
      initial.currentMemberId = mem.id;
      initial.modules = [
        {id:uid(),name:'健身运动',icon:'💪',color:'#e8927c',metric:{type:'number',label:'时长',unit:'分钟',hasSubtype:true},status:'active',sort:0},
        {id:uid(),name:'早睡打卡',icon:'🌙',color:'#7c9bb8',metric:{type:'time',isRoutine:true},status:'active',sort:1},

document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='in-hex'){ const v=e.target.value.trim(); const pv=document.getElementById('hex-preview'); if(pv&&/^#[0-9a-fA-F]{6}$/.test(v))pv.style.background=v; }
});

let dragSrcEl = null;
document.addEventListener('dragstart', function(e) { const dragSec = e.target.closest('.drag-section'); if (dragSec) { dragSrcEl = dragSec; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); setTimeout(() => dragSec.classList.add('dragging'), 0); } });
document.addEventListener('dragover', function(e) { e.preventDefault(); const targetSec = e.target.closest('.drag-section'); if (targetSec && targetSec !== dragSrcEl && dragSrcEl) { e.dataTransfer.dropEffect = 'move'; const rect = targetSec.getBoundingClientRect(); const offset = e.clientY - rect.top; if (offset > rect.height / 2) { targetSec.after(dragSrcEl); } else { targetSec.before(dragSrcEl); } } });
document.addEventListener('dragend', function(e) { if (dragSrcEl) { dragSrcEl.classList.remove('dragging'); const newOrder = [...document.querySelectorAll('.drag-section')].map(el => el.dataset.moduleId); DB.layout = newOrder; save(); dragSrcEl = null; } });

boot();
</script>
</body>
</html>
